name: ServicePro OS — Enterprise Production CI Pipeline

on:
  push:
    branches: [main, 'remediation/**', 'fix/**']
  pull_request:
    branches: [main, 'remediation/**', 'fix/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. FASTIFY TYPESCRIPT BACKEND VERIFICATION & TEST SUITE
  # ============================================================================
  backend-verification:
    name: Backend API & Database Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: servicepro_test
          POSTGRES_USER: servicepro_admin
          POSTGRES_PASSWORD: test_password_12345
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U servicepro_admin -d servicepro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Backend Dependencies
        run: |
          cd server
          npm ci

      - name: Compile Backend TypeScript
        run: |
          cd server
          npm run build

      - name: Run Database Migrations & Verification
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://servicepro_admin:test_password_12345@localhost:5432/servicepro_test
        run: |
          cd server
          npm run db:migrate
          npm run db:verify

      - name: Run Backend Unit & Integration Tests (Real PostGIS)
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://servicepro_admin:test_password_12345@localhost:5432/servicepro_test
          TEST_DATABASE_URL: postgresql://servicepro_admin:test_password_12345@localhost:5432/servicepro_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_012345678901234567890123456789
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_012345678901234567890123456789
          BOOTSTRAP_TOKEN: test_bootstrap_token_0123456789
          APP_ENCRYPTION_KEY: a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90
        run: |
          cd server
          npm test

  # ============================================================================
  # 2. REACT 19 ADMIN & STAFF WEB PORTAL PRODUCTION BUILD
  # ============================================================================
  admin-web-build:
    name: Admin & Staff Portal Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'admin_web/package-lock.json'

      - name: Install Web Portal Dependencies
        run: |
          cd admin_web
          npm ci

      - name: Lint Web Portal Source (oxlint)
        run: |
          cd admin_web
          npm run lint

      - name: Build Web Portal Bundle (React 19 + Vite)
        run: |
          cd admin_web
          npm run build

  # ============================================================================
  # 3. DOCKER TURNKEY ORCHESTRATION VERIFICATION
  # ============================================================================
  docker-validation:
    name: Docker Turnkey Architecture Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Validate & Build Docker Compose Images
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose build
          echo "Docker Compose configuration and image builds succeeded."

  # ============================================================================
  # 4. REPOSITORY INTEGRITY & ZERO DATA LEAKAGE AUDIT
  # ============================================================================
  security-audit:
    name: Zero Personal Data & Security Integrity Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Clean Environment Template & Run Release Validators
        run: |
          test -f .env.example
          test -f docker-compose.yml
          test -f COMMERCIAL_HANDOVER.md
          test -f PROJECT_ARCHITECTURE.md
          test -f INSTALLATION_GUIDE.md
          test -f API_DOCUMENTATION.md
          node scripts/validate_migrations.cjs
          node scripts/validate_dart_codebase.cjs
          echo "All commercial deployment dossiers, SQL migrations, and mobile codebase validators passed."

      - name: Backend Dependency Vulnerability Audit
        run: |
          cd server
          npm audit --omit=dev --audit-level=high

      - name: Frontend Dependency Vulnerability Audit
        run: |
          cd admin_web
          npm audit --omit=dev --audit-level=high

  # ============================================================================
  # 5. FLUTTER MOBILE APPLICATION STATIC ANALYSIS
  # ============================================================================
  flutter-analyze:
    name: Flutter Mobile Static Analysis (serviceos)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Packages & Analyze Dart Code
        run: |
          cd serviceos
          flutter pub get
          flutter analyze --no-fatal-infos

  # ============================================================================
  # 6. NATIVE ANDROID KOTLIN APPLICATION BUILD & UNIT TESTS (serviceos_android)
  # ============================================================================
  android-verification:
    name: Android Kotlin Build & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests & Assemble Debug APK
        run: |
          cd serviceos_android
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon
