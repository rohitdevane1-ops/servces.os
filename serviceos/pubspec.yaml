name: serviceos
description: ServiceOS — International Home Services Management Mobile Platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # Cloud Database & Backend
  supabase_flutter: ^2.8.0

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Navigation & Routing
  go_router: ^14.2.0

  # Networking & HTTP
  dio: ^5.4.3+1

  # Local Persistence & Caching
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Icons & Styling
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  lucide_icons_flutter: ^0.257.0

  # Geolocation & Maps
  geolocator: ^12.0.0
  latlong2: ^0.9.1
  flutter_map: ^7.0.2

  # Media & Hardware
  image_picker: ^1.1.2
  signature: ^5.4.1

  # Internationalization & Currency
  intl: ^0.19.0

  # Utilities
  uuid: ^4.4.0
  firebase_messaging: ^15.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/illustrations/
