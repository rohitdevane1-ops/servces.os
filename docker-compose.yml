# ==============================================================================
# ServicePro OS — Production Turnkey Docker Compose
# Complete Enterprise Architecture: Fastify API + React Web + PostgreSQL 16/PostGIS + Redis
# Target Commercial Turnkey Deployment ($20,000–$60,000 Acquisition Asset)
# ==============================================================================

services:
  # 1. PostgreSQL 16 with PostGIS Spatial Extension
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: always
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-servicepro}"
      POSTGRES_USER: "${POSTGRES_USER:-servicepro_admin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be configured in environment}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-servicepro_admin} -d ${POSTGRES_DB:-servicepro}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - servicepro_network

  # 1b. Optional Separate Demo Sandbox PostgreSQL 16 + PostGIS Database (2-DB Architecture)
  # Launch with: docker compose --profile demo up -d
  postgres_demo:
    profiles: ["demo"]
    image: postgis/postgis:16-3.4-alpine
    restart: always
    environment:
      POSTGRES_DB: "${DEMO_POSTGRES_DB:-servicepro_demo}"
      POSTGRES_USER: "${POSTGRES_USER:-servicepro_admin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be configured in environment}"
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-servicepro_admin} -d ${DEMO_POSTGRES_DB:-servicepro_demo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - servicepro_network

  # 2. Redis 7 In-Memory Cache & Ephemeral Dispatch State
  redis:
    image: redis:7-alpine
    restart: always
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes
        else
          redis-server --appendonly yes
        fi
      '
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: >
        sh -c '
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli -a "$$REDIS_PASSWORD" ping
          else
            redis-cli ping
          fi
        '
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - servicepro_network

  # 3. Fastify + TypeScript Core Backend Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      DATABASE_URL: "${DATABASE_URL:-postgresql://${POSTGRES_USER:-servicepro_admin}:${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be configured in environment}@postgres:5432/${POSTGRES_DB:-servicepro}}"
      DEMO_DATABASE_URL: "${DEMO_DATABASE_URL:-postgresql://${POSTGRES_USER:-servicepro_admin}:${POSTGRES_PASSWORD}@postgres_demo:5432/${DEMO_POSTGRES_DB:-servicepro_demo}}"
      APP_DEMO_MODE: "${APP_DEMO_MODE:-false}"
      UPLOAD_STORAGE_DIR: "/app/uploads"
      PAYMENT_GATEWAY: "${PAYMENT_GATEWAY:-stripe}"
      PAYTABS_PROFILE_ID: "${PAYTABS_PROFILE_ID:-}"
      PAYTABS_SERVER_KEY: "${PAYTABS_SERVER_KEY:-}"
      PAYTABS_REGION: "${PAYTABS_REGION:-ARE}"
      TELR_STORE_ID: "${TELR_STORE_ID:-}"
      TELR_AUTH_KEY: "${TELR_AUTH_KEY:-}"
      DEFAULT_TAX_RATE_BPS: "${DEFAULT_TAX_RATE_BPS:-500}"
      OUTBOX_POLL_INTERVAL_MS: "${OUTBOX_POLL_INTERVAL_MS:-500}"
      REDIS_URL: "redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379"
      JWT_SECRET: "${JWT_SECRET:?Error: JWT_SECRET must be configured in environment}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?Error: JWT_REFRESH_SECRET must be configured in environment}"
      BOOTSTRAP_TOKEN: "${BOOTSTRAP_TOKEN:?Error: BOOTSTRAP_TOKEN must be configured in environment}"
      APP_ENCRYPTION_KEY: "${APP_ENCRYPTION_KEY:?Error: APP_ENCRYPTION_KEY must be configured in environment}"
      CAPTCHA_ENFORCED: "${CAPTCHA_ENFORCED:-false}"
      CAPTCHA_SITE_KEY: "${CAPTCHA_SITE_KEY:-${VITE_TURNSTILE_SITE_KEY:-}}"
      CAPTCHA_SECRET_KEY: "${CAPTCHA_SECRET_KEY:-}"
      CORS_ORIGIN: "${CORS_ORIGIN:?Error: CORS_ORIGIN must be configured in environment}"
      STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY:-}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      TWILIO_FROM_PHONE: "${TWILIO_FROM_PHONE:-}"
      TRUST_PROXY: "${TRUST_PROXY:-true}"
      OUTBOX_WORKER_ENABLED: "${OUTBOX_WORKER_ENABLED:-true}"
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - servicepro_network

  # 4. React 19 + Vite Admin & Staff Web Control Portal
  frontend:
    build:
      context: ./admin_web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-/api/v1}"
        VITE_TURNSTILE_SITE_KEY: "${VITE_TURNSTILE_SITE_KEY:-}"
        VITE_DEMO_MODE: "${VITE_DEMO_MODE:-false}"
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_BIND_IP:-0.0.0.0}:${WEB_PORT:-80}:80"
    networks:
      - servicepro_network

volumes:
  postgres_data:
    name: servicepro_postgres_data
  postgres_demo_data:
    name: servicepro_postgres_demo_data
  redis_data:
    name: servicepro_redis_data
  uploads_data:
    name: servicepro_uploads_data

networks:
  servicepro_network:
    name: servicepro_network
    driver: bridge
