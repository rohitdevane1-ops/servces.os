# ==============================================================================
# ServicePro OS — Production Turnkey Docker Compose
# Complete Enterprise Architecture: Fastify API + React Web + PostgreSQL 16/PostGIS + Redis
# Target Commercial Turnkey Deployment ($20,000–$60,000 Acquisition Asset)
# ==============================================================================

services:
  # 1. PostgreSQL 16 with PostGIS Spatial Extension
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: always
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-servicepro}"
      POSTGRES_USER: "${POSTGRES_USER:-servicepro_admin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be configured in environment}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-servicepro_admin} -d ${POSTGRES_DB:-servicepro}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - servicepro_network

  # 2. Redis 7 In-Memory Cache & Ephemeral Dispatch State
  redis:
    image: redis:7-alpine
    restart: always
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes
        else
          redis-server --appendonly yes
        fi
      '
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: >
        sh -c '
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli -a "$$REDIS_PASSWORD" ping
          else
            redis-cli ping
          fi
        '
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - servicepro_network

  # 3. Fastify + TypeScript Core Backend Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-servicepro_admin}:${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be configured in environment}@postgres:5432/${POSTGRES_DB:-servicepro}"
      REDIS_URL: "${REDIS_PASSWORD:+redis://:${REDIS_PASSWORD}@}redis:6379"
      JWT_SECRET: "${JWT_SECRET:?Error: JWT_SECRET must be configured in environment}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?Error: JWT_REFRESH_SECRET must be configured in environment}"
      BOOTSTRAP_TOKEN: "${BOOTSTRAP_TOKEN:?Error: BOOTSTRAP_TOKEN must be configured in environment}"
      APP_ENCRYPTION_KEY: "${APP_ENCRYPTION_KEY:?Error: APP_ENCRYPTION_KEY must be configured in environment}"
      CAPTCHA_ENFORCED: "${CAPTCHA_ENFORCED:-false}"
      CAPTCHA_SECRET_KEY: "${CAPTCHA_SECRET_KEY:-}"
      CORS_ORIGIN: "${CORS_ORIGIN:?Error: CORS_ORIGIN must be configured in environment}"
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - servicepro_network

  # 4. React 19 + Vite Admin & Staff Web Control Portal
  frontend:
    build:
      context: ./admin_web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:3000/api/v1}"
        VITE_TURNSTILE_SITE_KEY: "${VITE_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}"
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_BIND_IP:-0.0.0.0}:${WEB_PORT:-80}:80"
    networks:
      - servicepro_network

volumes:
  postgres_data:
    name: servicepro_postgres_data
  redis_data:
    name: servicepro_redis_data

networks:
  servicepro_network:
    name: servicepro_network
    driver: bridge
